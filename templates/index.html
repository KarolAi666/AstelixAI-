<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Astelix AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #8b5cf6;
            --accent: #a78bfa;
            --gradient: linear-gradient(135deg, #7c3aed, #8b5cf6, #a78bfa);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0a1a 0%, #1a0f2e 50%, #0f0a1a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 12px;
            padding-bottom: 80px;
        }
        
        .glass {
            background: rgba(30, 15, 50, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }
        
        .gradient-text {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .chat-bubble { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .typing-dots { display: flex; gap: 4px; padding: 8px 0; }
        .typing-dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .model-badge {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 10px; font-weight: 600;
            background: var(--gradient); color: white;
        }
        
        .confidence-bar {
            height: 3px; border-radius: 2px;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
            transition: width 0.5s ease;
        }
        
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: rgba(15, 10, 26, 0.3); border-radius: 3px; }
        #messages::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
        
        .mode-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .mode-btn.active {
            background: var(--gradient);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        
        .mode-btn:active { transform: scale(0.95); }
        
        #query { min-height: 44px; max-height: 120px; }
        
        @media (max-width: 640px) {
            body { padding: 8px; padding-bottom: 70px; }
            .glass { padding: 12px; }
            .mode-btn { font-size: 10px; padding: 6px 8px; }
        }
        
        @media (min-width: 768px) {
            body { padding: 20px; }
            .max-w-4xl { max-width: 800px; margin: 0 auto; }
        }
        
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto">
        <header class="glass rounded-2xl p-3 sm:p-4 mb-3 sm:mb-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 sm:gap-3">
                    <span class="text-2xl sm:text-3xl">⭐</span>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold gradient-text">Astelix AI</h1>
                        <p class="text-[10px] sm:text-xs text-purple-400">Hybrid Intelligence System</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span class="text-[10px] sm:text-xs text-purple-400 hidden sm:inline">Online</span>
                    <span id="modelCount" class="text-[10px] sm:text-xs bg-purple-900/30 px-2 py-1 rounded-full text-purple-300">5 AI</span>
                </div>
            </div>
        </header>

        <div id="messages" class="glass rounded-2xl p-3 sm:p-4 h-[55vh] overflow-y-auto mb-3 sm:mb-4">
            <div id="welcome" class="text-center py-8 sm:py-12">
                <span class="text-5xl sm:text-6xl block mb-4">⭐</span>
                <h2 class="text-xl sm:text-2xl font-bold gradient-text">Astelix AI</h2>
                <p class="text-purple-400 text-sm sm:text-base mt-2">System łączący najlepsze modele AI</p>
                <div class="flex justify-center gap-1 sm:gap-2 mt-3 sm:mt-4 text-[10px] sm:text-xs text-purple-500 flex-wrap">
                    <span class="px-2 sm:px-3 py-1 glass rounded-full">GPT-4</span>
                    <span class="px-2 sm:px-3 py-1 glass rounded-full">Claude 3</span>
                    <span class="px-2 sm:px-3 py-1 glass rounded-full">Gemini Pro</span>
                    <span class="px-2 sm:px-3 py-1 glass rounded-full">Llama 2</span>
                    <span class="px-2 sm:px-3 py-1 glass rounded-full">Mistral</span>
                </div>
                <p class="text-[10px] text-purple-500/50 mt-4">© 2024 Karol Jaskólski</p>
            </div>
        </div>

        <div class="glass rounded-2xl p-3 sm:p-4 fixed bottom-0 left-0 right-0 max-w-4xl mx-auto" style="margin-bottom: 0;">
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-1 sm:gap-2 mb-2 sm:mb-3">
                <button onclick="setMode('GENERAL')" data-mode="GENERAL" class="mode-btn active p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-bolt text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Ogólny</span>
                </button>
                <button onclick="setMode('CODING')" data-mode="CODING" class="mode-btn p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-code text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Kod</span>
                </button>
                <button onclick="setMode('ANALYSIS')" data-mode="ANALYSIS" class="mode-btn p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-chart-line text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Analiza</span>
                </button>
                <button onclick="setMode('CREATION')" data-mode="CREATION" class="mode-btn p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-palette text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Kreacja</span>
                </button>
                <button onclick="setMode('REASONING')" data-mode="REASONING" class="mode-btn p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-brain text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Rozum</span>
                </button>
                <button onclick="setMode('MULTI_MODAL')" data-mode="MULTI_MODAL" class="mode-btn p-1.5 sm:p-2 rounded-xl text-[10px] sm:text-xs bg-purple-900/30 hover:bg-purple-800/30 transition-all flex items-center justify-center gap-1 sm:gap-2">
                    <i class="fas fa-image text-[10px] sm:text-xs"></i>
                    <span class="hidden xs:inline">Multi</span>
                </button>
            </div>

            <div class="flex items-end gap-2">
                <div class="flex-1 relative">
                    <textarea id="query" rows="1" class="w-full bg-purple-950/30 border border-purple-700/30 rounded-xl p-2 sm:p-3 text-sm resize-none focus:outline-none focus:border-purple-500 transition-colors text-purple-100 placeholder-purple-500/50" placeholder="Zapytaj Astelix AI..." style="min-height: 40px;"></textarea>
                    <div class="absolute bottom-1.5 sm:bottom-2 right-1.5 sm:right-2 flex gap-0.5 sm:gap-1">
                        <button onclick="toggleVoice()" class="p-1.5 sm:p-2 rounded-lg bg-purple-900/30 hover:bg-purple-500/20 transition-colors text-purple-400 touch-manipulation">
                            <i class="fas fa-microphone text-xs sm:text-sm"></i>
                        </button>
                        <button onclick="clearChat()" class="p-1.5 sm:p-2 rounded-lg bg-purple-900/30 hover:bg-purple-500/20 transition-colors text-purple-400 touch-manipulation">
                            <i class="fas fa-trash text-xs sm:text-sm"></i>
                        </button>
                    </div>
                </div>
                <button id="sendBtn" onclick="sendMessage()" class="p-2.5 sm:p-3 bg-gradient-to-r from-purple-600 to-purple-400 rounded-xl hover:scale-105 active:scale-95 transition-transform disabled:opacity-50 disabled:cursor-not-allowed touch-manipulation">
                    <i class="fas fa-paper-plane text-white text-sm sm:text-base"></i>
                </button>
            </div>
            
            <div id="statusBar" class="hidden mt-1.5 sm:mt-2 flex items-center justify-between text-[10px] sm:text-xs text-purple-400">
                <div class="flex items-center gap-2">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span>Astelix AI myśli...</span>
                </div>
                <span id="modelStatus">Używam: GPT-4</span>
            </div>
        </div>
    </div>

    <script>
        const state = { mode: 'GENERAL', messages: [], isProcessing: false, ws: null };

        document.addEventListener('DOMContentLoaded', () => {
            setupWebSocket();
            setupEventListeners();
            updateModelCount();
        });

        function setupWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            try {
                state.ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
                state.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'start') {
                            removeTypingIndicator();
                            addMessage('assistant', '', data.model);
                        } else if (data.type === 'chunk') {
                            const lastMsg = document.querySelector('#messages .chat-bubble:last-child .text-sm');
                            if (lastMsg) {
                                lastMsg.textContent += data.data;
                                scrollToBottom();
                            }
                        } else if (data.type === 'end') {
                            const lastBubble = document.querySelector('#messages .chat-bubble:last-child .glass');
                            if (lastBubble && data.metadata) {
                                const metaDiv = lastBubble.querySelector('.flex.items-center.gap-3');
                                if (metaDiv) {
                                    metaDiv.innerHTML = `<span class="model-badge">${data.metadata.model || 'Astelix AI'}</span>
                                        <span>Pewność: ${Math.round((data.metadata.confidence || 0.85) * 100)}%</span>
                                        <span>⏱ 0.5s</span>
                                        <button onclick="copyMessage(this)" class="hover:text-white transition-colors ml-auto touch-manipulation"><i class="fas fa-copy text-xs"></i></button>`;
                                }
                                const bar = lastBubble.querySelector('.confidence-bar');
                                if (bar && data.metadata.confidence) { bar.style.width = (data.metadata.confidence * 100) + '%'; }
                            }
                            state.isProcessing = false;
                            document.getElementById('sendBtn').disabled = false;
                            document.getElementById('statusBar').classList.add('hidden');
                        } else if (data.type === 'error') {
                            removeTypingIndicator();
                            addMessage('assistant', '❌ Błąd: ' + data.data);
                            state.isProcessing = false;
                            document.getElementById('sendBtn').disabled = false;
                            document.getElementById('statusBar').classList.add('hidden');
                        }
                    } catch (e) { console.error('WebSocket error:', e); }
                };
                state.ws.onclose = () => { setTimeout(setupWebSocket, 3000); };
            } catch (e) { console.error('WebSocket setup error:', e); }
        }

        function setMode(mode) {
            state.mode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) btn.classList.add('active');
            });
        }

        function addMessage(role, content, model = null) {
            const container = document.getElementById('messages');
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = `chat-bubble flex gap-2 sm:gap-3 mb-2 sm:mb-4 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] rounded-2xl p-2.5 sm:p-4 ${role === 'user' ? 'bg-gradient-to-r from-purple-600/20 to-purple-400/20 border border-purple-500/20' : 'glass'}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'text-xs sm:text-sm whitespace-pre-wrap text-purple-100';
            contentDiv.textContent = content;
            bubble.appendChild(contentDiv);
            if (role === 'assistant' && model) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'flex items-center gap-2 sm:gap-3 mt-1.5 sm:mt-2 pt-1.5 sm:pt-2 border-t border-purple-500/20 text-[10px] sm:text-xs text-purple-400 flex-wrap';
                metaDiv.innerHTML = `<span class="model-badge">${model || 'Astelix AI'}</span><span>Pewność: ...%</span><span>⏱ ...s</span>
                    <button onclick="copyMessage(this)" class="hover:text-white transition-colors ml-auto touch-manipulation"><i class="fas fa-copy text-xs"></i></button>`;
                bubble.appendChild(metaDiv);
                const barDiv = document.createElement('div');
                barDiv.className = 'mt-1';
                barDiv.innerHTML = `<div class="confidence-bar" style="width: 0%"></div>`;
                bubble.appendChild(barDiv);
            }
            div.appendChild(bubble);
            container.appendChild(div);
            scrollToBottom();
            state.messages.push({role, content, model});
        }

        function addTypingIndicator() {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'chat-bubble flex gap-2 sm:gap-3 mb-2 sm:mb-4 justify-start';
            div.innerHTML = `<div class="glass rounded-2xl p-2.5 sm:p-4"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            container.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('query');
            const text = input.value.trim();
            if (!text || state.isProcessing) return;
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            state.isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('statusBar').classList.remove('hidden');
            addTypingIndicator();
            try {
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    state.ws.send(JSON.stringify({ query: text, mode: state.mode, temperature: 0.7, max_tokens: 1000 }));
                } else {
                    const response = await fetch('/api/v1/chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ query: text, mode: state.mode, temperature: 0.7, max_tokens: 1000 })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    removeTypingIndicator();
                    addMessage('assistant', data.response, data.model);
                    const lastBubble = document.querySelector('#messages .chat-bubble:last-child .glass');
                    if (lastBubble && data.confidence) {
                        const bar = lastBubble.querySelector('.confidence-bar');
                        if (bar) bar.style.width = (data.confidence * 100) + '%';
                        const metaDiv = lastBubble.querySelector('.flex.items-center.gap-3');
                        if (metaDiv) {
                            metaDiv.innerHTML = `<span class="model-badge">${data.model || 'Astelix AI'}</span>
                                <span>Pewność: ${Math.round((data.confidence || 0.85) * 100)}%</span>
                                <span>⏱ ${(data.processing_time || 0.5).toFixed(2)}s</span>
                                <button onclick="copyMessage(this)" class="hover:text-white transition-colors ml-auto touch-manipulation"><i class="fas fa-copy text-xs"></i></button>`;
                        }
                    }
                    state.isProcessing = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('statusBar').classList.add('hidden');
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage('assistant', '❌ Błąd: ' + error.message);
                state.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('statusBar').classList.add('hidden');
            }
        }

        function copyMessage(btn) {
            const bubble = btn.closest('.glass');
            const content = bubble.querySelector('.text-sm, .text-xs');
            if (content) {
                navigator.clipboard.writeText(content.textContent).catch(() => {});
                btn.innerHTML = '<i class="fas fa-check text-green-400 text-xs"></i>';
                setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy text-xs"></i>'; }, 2000);
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            if (!confirm('Wyczyścić wszystkie wiadomości?')) return;
            document.getElementById('messages').innerHTML = `
                <div id="welcome" class="text-center py-8 sm:py-12">
                    <span class="text-5xl sm:text-6xl block mb-4">⭐</span>
                    <h2 class="text-xl sm:text-2xl font-bold gradient-text">Astelix AI</h2>
                    <p class="text-purple-400 text-sm sm:text-base mt-2">System łączący najlepsze modele AI</p>
                    <div class="flex justify-center gap-1 sm:gap-2 mt-3 sm:mt-4 text-[10px] sm:text-xs text-purple-500 flex-wrap">
                        <span class="px-2 sm:px-3 py-1 glass rounded-full">GPT-4</span>
                        <span class="px-2 sm:px-3 py-1 glass rounded-full">Claude 3</span>
                        <span class="px-2 sm:px-3 py-1 glass rounded-full">Gemini Pro</span>
                        <span class="px-2 sm:px-3 py-1 glass rounded-full">Llama 2</span>
                        <span class="px-2 sm:px-3 py-1 glass rounded-full">Mistral</span>
                    </div>
                    <p class="text-[10px] text-purple-500/50 mt-4">© 2024 Karol Jaskólski</p>
                </div>
            `;
            state.messages = [];
        }

        function toggleVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Twoja przeglądarka nie obsługuje mowy');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pl-PL';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                const voiceBtn = document.querySelector('.fa-microphone')?.parentElement;
                if (voiceBtn) voiceBtn.style.color = '#7c3aed';
            };
            recognition.onend = () => {
                const voiceBtn = document.querySelector('.fa-microphone')?.parentElement;
                if (voiceBtn) voiceBtn.style.color = '';
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('query').value = transcript;
                sendMessage();
            };
            recognition.start();
        }

        function updateModelCount() {
            fetch('/api/v1/models')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('modelCount').textContent = data.active + ' AI';
                })
                .catch(() => {});
        }

        function setupEventListeners() {
            document.getElementById('query').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            document.getElementById('query').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && state.ws && state.ws.readyState !== WebSocket.OPEN) {
                    setupWebSocket();
                }
            });
        }

        console.log('⭐ Astelix AI initialized');
        console.log('📱 Mode:', state.mode);
        console.log('© 2024 Karol Jaskólski');
        console.log('📧 cocieto2580123@gmail.com');
        console.log('📞 +48 791 380 755');
    </script>
</body>
</html>
